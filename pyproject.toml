[project]
name = "coding-agent"
version = "0.1.0"
description = "Local coding agent with OpenAI-compatible provider failover"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2",
    "python-dotenv>=1",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agent = "coding_agent.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
